<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="PizZap: gere receitas de pizza com as proporções certas para o tamanho, a massa e os sabores que você escolher.">
  <title>{% block titulo %}PizZap{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 30 3 6a26 26 0 0 1 26 0Z' fill='%23ffde59'/%3E%3Cpath d='M3 6a26 26 0 0 1 26 0' stroke='%23ff751f' stroke-width='4' fill='none'/%3E%3Ccircle cx='13' cy='13' r='2.5' fill='%23ff3131'/%3E%3Ccircle cx='19' cy='18' r='2.5' fill='%23ff3131'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="{% block classe_body %}{% endblock %}">
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>

  <header class="topo">
    <div class="topo-interno">
      <a class="marca" href="{{ url_for('index') }}" aria-label="PizZap, página inicial">
        <svg class="marca-icone" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M16 30 3 6a26 26 0 0 1 26 0Z" fill="#ffde59"/>
          <path d="M3 6a26 26 0 0 1 26 0" stroke="#ff751f" stroke-width="4" fill="none" stroke-linecap="round"/>
          <circle cx="13" cy="13" r="2.5" fill="#ff3131"/>
          <circle cx="19" cy="18" r="2.5" fill="#ff3131"/>
          <circle cx="16" cy="9" r="1.6" fill="#ff3131"/>
        </svg>
        <span>Piz<b>Zap</b></span>
      </a>
      <nav class="menu" aria-label="Principal">
        <a href="{{ url_for('index') }}"{% if request.endpoint == 'index' %} aria-current="page"{% endif %}>Início</a>
        <a class="menu-cta" href="{{ url_for('nova_receita') }}"{% if request.endpoint == 'nova_receita' %} aria-current="page"{% endif %}>Montar receita</a>
      </nav>
    </div>
  </header>

  <main id="conteudo" class="pagina">
    {% block conteudo %}{% endblock %}
  </main>

  <footer class="rodape">
    <p><b>PizZap</b> · Projeto acadêmico de Gestão de Projetos · 2026</p>
    <p>João Pedro Vicente Teixeira do Prado · Maria Fernanda Sayuri Soares Nagahashi · Victor Augusto Viana Fernandes</p>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
